# SOLIDUNS — Agente de leilões — PRÉ-ANÁLISE DAS MATRÍCULAS (v1.0, 07/10/2026)
# Todo dia às 8h30 (Brasília), depois da coleta das 7h. Custo zero (sem IA paga).
# Lê as matrículas dos imóveis da Caixa na fila de triagem e grava em leiloes_preanalise (SQL 108).
name: Leilões - pré-análise

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:

concurrency:
  group: leiloes-preanalise
  cancel-in-progress: false

jobs:
  preanalise:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar leitor de imagem (Tesseract, gratuito)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Instalar dependências
        run: pip install requests pypdf

      - name: Pré-analisar matrículas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PREANALISE_LIMITE: "300"
          PREANALISE_TEMPO_MAX: "2400"
        run: python coletor/preanalisar_leiloes.py
