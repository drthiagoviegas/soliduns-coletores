# SOLIDUNS — Agente de leilões — PRÉ-ANÁLISE DAS MATRÍCULAS (v1.1, 09/10/2026)
# 3 vezes por dia (8h30, 14h30 e 20h30 de Brasília), 3 matrículas ao mesmo tempo. Custo zero (sem IA paga;
# repositório público = minutos do GitHub gratuitos). Fila de ~18 mil imóveis: ~900/dia.
# Lê as matrículas dos imóveis da Caixa na fila de triagem e grava em leiloes_preanalise (SQL 108).
name: Leilões - pré-análise

on:
  schedule:
    - cron: "30 11,17,23 * * *"
  workflow_dispatch:

concurrency:
  group: leiloes-preanalise
  cancel-in-progress: false

jobs:
  preanalise:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar leitor de imagem (Tesseract, gratuito)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Instalar dependências
        run: pip install requests pypdf

      - name: Pré-analisar matrículas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PREANALISE_LIMITE: "300"
          PREANALISE_TEMPO_MAX: "2400"
          PREANALISE_PARALELO: "3"
        run: python coletor/preanalisar_leiloes.py
