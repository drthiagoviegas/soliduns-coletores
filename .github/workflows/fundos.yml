# SOLIDUNS — Fundos de investimento (SQL 51): cadastro, Informe Diário e
# extrato da CVM + CDI do Banco Central.
# De segunda a sexta às 10h30 de Brasília (13h30 UTC); também à mão em:
# Actions -> "Fundos" -> Run workflow.
# A 1ª execução baixa 38 meses de informes (~450 MB) e grava ~285 mil
# linhas: leva de 15 a 30 minutos. As demais levam poucos minutos.
name: Fundos

on:
  schedule:
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fundos:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r coletor/requirements.txt

      - name: CVM + Banco Central e gravar no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python coletor/coletar_fundos.py
